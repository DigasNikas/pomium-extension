name: Release

# Two ways to cut a release:
#
#   1. Actions tab -> Release -> Run workflow -> enter a version (e.g. 1.2.3
#      or 1.2.3-rc1). This bumps manifest.json, commits it to main, creates
#      the tag, and runs the whole pipeline in one go.
#   2. Tag main by hand: git tag v1.2.3 && git push origin v1.2.3
#
# A hyphenated version (1.1.0-rc1) publishes as a prerelease instead: it is
# published but stays off "latest" and out of release notifications. That is
# the staging path if you want to check an artifact before it counts as the
# real thing.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.2.3 or 1.2.3-rc1 (leave off the v)'
        required: true

# Needed to create the release and upload its asset, and for cut-tag to push
# a commit and a tag. Nothing else is granted.
permissions:
  contents: write

jobs:
  # Only runs for the button-driven path. Bumps manifest.json to the
  # requested version, commits it to main, and creates the tag from that
  # commit — so the tag and the manifest it names are correct together
  # instead of relying on someone to bump the version and tag it correctly
  # by hand. The Web Store refuses to reuse a version, so getting this wrong
  # costs a resubmission.
  cut-tag:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Compute and validate the version
        id: tag
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then
            echo "::error::version input is empty"
            exit 1
          fi
          TAG="v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::tag ${TAG} already exists — versions cannot be reused"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
      - name: Bump manifest.json to the release version
        run: |
          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
            manifest.version = '${{ steps.tag.outputs.version }}';
            fs.writeFileSync('manifest.json', JSON.stringify(manifest, null, 2) + '\n');
          "
      - name: Commit the bump, then tag it
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- manifest.json; then
            echo "manifest.json already at ${{ steps.tag.outputs.version }}, no commit needed"
          else
            git add manifest.json
            git commit -m "chore: release ${{ steps.tag.outputs.tag }}"
            git push origin HEAD:main
          fi
          git tag -a "${{ steps.tag.outputs.tag }}" -m "${{ steps.tag.outputs.tag }}"
          git push origin "${{ steps.tag.outputs.tag }}"

  release:
    needs: cut-tag
    if: always() && (needs.cut-tag.result == 'success' || needs.cut-tag.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.cut-tag.outputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The Web Store keys off manifest.json's version and refuses to reuse
      # one, so a tag that disagrees with the manifest produces a release
      # whose artifact cannot be uploaded under that name. Fail here instead.
      - name: Tag must match manifest version
        run: |
          TAG="${RELEASE_TAG#v}"
          MANIFEST="$(node -p "require('./manifest.json').version")"
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "::error::tag ${RELEASE_TAG} implies version ${TAG}, but manifest.json says ${MANIFEST}"
            exit 1
          fi
          echo "tag and manifest agree on ${MANIFEST}"

      - name: Test
        run: npm test

      - name: Build extension zip
        run: ./scripts/package.sh

      # A zip whose manifest.json sits inside a folder is rejected by the Web
      # Store, and the mistake is invisible until upload. Catch it in CI.
      - name: Zip layout must have manifest.json at the root
        run: |
          VERSION="${RELEASE_TAG#v}"
          ZIP="dist/pomium-${VERSION}.zip"
          if ! unzip -l "$ZIP" | awk '{print $4}' | grep -qx 'manifest.json'; then
            echo "::error::manifest.json is not at the root of ${ZIP}"
            unzip -l "$ZIP" | head -20
            exit 1
          fi
          for dev in test/ docs/ store/ scripts/ package.json; do
            if unzip -l "$ZIP" | awk '{print $4}' | grep -q "^${dev}"; then
              echo "::error::${dev} was packaged into ${ZIP} and should not be"
              exit 1
            fi
          done
          # The Web Store treats ANY file named manifest.json anywhere in the
          # package as an extension manifest and rejects the upload if there
          # is more than one. This shipped once: assets/ carried its own
          # manifest.json listing the character tiers, which is why that file
          # is now assets/atlases.json.
          MANIFESTS="$(unzip -l "$ZIP" | awk '{print $4}' | grep -Ec '(^|/)manifest\.json$' || true)"
          if [ "$MANIFESTS" != "1" ]; then
            echo "::error::${ZIP} contains ${MANIFESTS} files named manifest.json; the Web Store allows exactly one"
            unzip -l "$ZIP" | awk '{print $4}' | grep -E '(^|/)manifest\.json$'
            exit 1
          fi
          echo "layout ok: $(unzip -l "$ZIP" | tail -1)"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          # A hyphen in the version marks a prerelease, per semver: v1.1.0-rc1
          # publishes but stays off "latest" and out of release notifications.
          PRERELEASE=""
          case "$VERSION" in
            *-*) PRERELEASE="--prerelease" ;;
          esac
          gh release create "$RELEASE_TAG" \
            "dist/pomium-${VERSION}.zip" \
            --title "Pomium ${VERSION}" \
            --generate-notes \
            $PRERELEASE
          echo "Released ${RELEASE_TAG}${PRERELEASE:+ (prerelease)}"
